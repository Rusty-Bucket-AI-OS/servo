[package]
name = "servo-content"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
repository.workspace = true
description = "The Rusty Bucket content process: Servo as a WASI program that loads a page and paints it with a software GL into memory."

[[bin]]
name = "servo-content"
path = "main.rs"

[dependencies]
dpi = { workspace = true }
embedder_traits = { workspace = true }
image = { workspace = true }
log = { workspace = true }
servo = { path = "../../components/servo", default-features = false }
url = { workspace = true }

# parking_lot's WebAssembly parker needs the atomics (memory.atomic.wait) and a nightly feature gate (the build sets RUSTC_BOOTSTRAP=1); without it
# every lock that has to wait panics with "Parking not supported on this platform".
[target.'cfg(target_os = "wasi")'.dependencies]
parking_lot_core = { version = "0.9", features = ["nightly"] }
