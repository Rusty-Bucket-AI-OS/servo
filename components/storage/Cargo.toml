[package]
name = "servo-storage"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true
autotests = false # Inhibit lookup for tests/*.rs without [[test]] sections

[lib]
name = "storage"
path = "lib.rs"

[dependencies]
libc = { workspace = true }
log = { workspace = true }
malloc_size_of = { workspace = true }
malloc_size_of_derive = { workspace = true }
net_traits = { workspace = true }
postcard = { workspace = true }
profile_traits = { workspace = true }
rusqlite = { workspace = true }
rustc-hash = { workspace = true }
sea-query = { workspace = true }
sea-query-rusqlite = { workspace = true }
serde = { workspace = true }
servo-base = { workspace = true }
servo-config = { workspace = true }
servo-url = { workspace = true }
storage_traits = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

# On WASI the bundled SQLite has no `unix` VFS that works (no file locks, no `fchmod`); this one needs only `open`, `read`, `write`, `fsync`, `fstat`,
# `access` and `unlink`, and the build sets `LIBSQLITE3_FLAGS=-DSQLITE_OS_OTHER=1` (see ports/servo-content) so it is the default.
[target.'cfg(target_os = "wasi")'.dependencies]
libsqlite3-sys = { version = "0.36", features = ["wasm32-wasi-vfs"] }

[dev-dependencies]
profile = { workspace = true }
servo-default-resources = { workspace = true }
url = { workspace = true }

[lints]
workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
